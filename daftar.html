<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <div class="form-box">
        <h2>Form pendaftaran siswa</h2>
        <form id="formDaftar">
            <label>Ussername</label>
            <input id="username" required type="text" placeholder="masukkan nama">

            <label>password</label>
            <input id="pw" required type="password" placeholder="masukkan Password">

            <button type="submit" id="daftar">Daftar</button>
        </form>
    </div>


    <script>
        let daftar = document.getElementById("formDaftar")

        daftar.addEventListener("submit", function (event) {
            event.preventDefault()

            const username = document.getElementById("username").value
            const pw = document.getElementById("pw").value

            //Ambil daftar user yang sudah ada di localStorage (jika belum ada, buat array kosong)
            const daftarUser = JSON.parse(localStorage.getItem('users')) || [];
            
            //Cek apakah username sudah dipakai
            const userAda = daftarUser.some(user => user.username == username)

            if (userAda) {
                alert("Username sudah terdaftar! Gunakan username lain")
                return;
            }

            const userBaru = {
                username : username,
                password : pw
            };

            daftarUser.push(userBaru)
            localStorage.setItem('users', JSON.stringify(daftarUser))


            alert("Berhasil daftar")
            window.location.href ="index.html"

            daftar.reset()

        })

    </script>
</body>

</html>
