<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <div class="form-box">
        <h2>Form pendaftaran siswa</h2>
        <form id="formDaftar">
            <label>nama Lengkap</label>
            <input required type="text" placeholder="masukkan nama">

            <label>NIS</label>
            <input required type="text" placeholder="masukkan NIS">

            <label>Kelas</label>
            <select>
                <option>X</option>
                <option>XI</option>
                <option>XII</option>
            </select>

            <label>Jenis Kelamin</label>
            <select>
                <option>laki-laki</option>
                <option>perempuan</option>
            </select>
            
            <label>Alamat</label>
            <input required type="text" placeholder="Masukkan alamat">

            <button type="submit" id="daftar" >Daftar</button>
        </form>
    </div>


    <script>
        let daftar = document.getElementById("formDaftar")

        daftar.addEventListener("submit", function(event) {
            event.preventDefault()
            window.location.href = "dashboard.html"

        })

    </script>
</body>

</html>
