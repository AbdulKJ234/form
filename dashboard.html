<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --blue-dark: #202435;
            --blue-light: #2e3547;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Helvetica, sans-serif;
        }

        body {
            background-color: var(--blue-light);
            color: rgb(205, 207, 211);
        }

        .sidebar {
            position: fixed;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(186, 186, 186, 0.353);
            background-color: var(--blue-dark);
            height: 100vh;
            width: 18rem;
            padding-top: 20px;
            left: -100%;
            transition: .5s ease;
        }

        .sidebar.active {
            left: 0;
        }


        .sidebar h2 {
            font-size: 1.5rem;
            font-weight: 700;
            padding-left: 1.5rem;
            margin-top: 1rem;
        }

        hr {
            width: 15rem;
            height: 1px;
            margin: 20px auto;
            background-color: rgba(186, 186, 186, 0.452);
            border: none;
        }
        .sidebar a {
            text-decoration: none;
            color: rgb(205, 207, 211);
            font-size: 1.1rem;
            padding: 1rem;
            width: 95%;
            border-radius: 0.2rem;
            cursor: pointer;

            &:hover {
                background-color: var(--blue-light);
                transition: .1s ease;
            }
        }

        .konten {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 70vh;
            gap: 1rem;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            margin-top: 3rem;
        }

        .buttons button {
            background-color: var(--blue-dark);
            display: block;
            color: whitesmoke;
            padding: 1rem;
            border: none;
            border-radius: 0.3rem;
            font-size: 1.2rem;
            box-shadow: 3px 3px 8px rgba(143, 143, 143, 0.185);
            cursor: pointer;

        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        i {
            margin-right: 1rem;
        }

        footer {
            margin-top: 13rem;
            background-color: #28324b;
            display: flex;
            justify-content: space-around;
            padding: 2rem;
        }

    </style>
</head>

<body>
    <div id="sidebar" class="sidebar">
        <div class="logo">
            <img src="img/lolokgo.jpeg" alt="ini harusnya logo">
            <h2>MyDashboard</h2>
        </div>
        <hr>
        <a onclick="ubahHalaman('Beranda'); return false;">
            <i class="fa-solid fa-house"></i>
            Home</a>
        <a onclick="ubahHalaman('Profil'); return false;">
            <i class="fa-solid fa-circle-user"></i>
            Profil</a>
        <a onclick="ubahHalaman('Galeri'); return false;">
            <i class="fa-solid fa-image"></i>
            Gallery</a>
        <a onclick="ubahHalaman('kontak'); return false;"><i class="fa-solid fa-phone"></i> Contact</a>
    </div>

    <div class="konten">
        <h1 id="judul">INI DASHBOARD</h1>
        <p id="isi">ini adalah halaman dashboard setelah login</p>

        <div class="buttons">
            <button onclick="ubahTulisan()">
                ubah tulisan
            </button>
            <button onclick="toggleMenu()">
                Menu
            </button>
        </div>
    </div>


    <footer>
        <p>INI FOOTER</p>
        <p>&copy; orang-orang pepekelge 2067</p>
    </footer>



    <script src="js/dashboard.js"></script>
</body>

</html>
